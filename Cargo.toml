[package]
name = "nekorisu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
description = "Archive agent sessions to your own storage, read them back by line, restore them byte-exact."
repository = "https://github.com/NEKO-CwC/nekorisu"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1.1.11"
hex = "0.4.3"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "io-std", "sync", "signal", "time", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# The version tokio already uses, so no second copy is built.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[test]]
# The features, written as scenarios in tests/e2e/features, run against the real binaries.
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

[dev-dependencies]
# Runs tests/e2e/features/*.feature (Gherkin, written in Chinese).
cucumber = "0.23"
# A terminal for the steps a person has to confirm (accept, allow-exec).
portable-pty = "0.9"
# In-process WebDAV server for the storage and archive tests.
dav-server = { version = "0.12", default-features = false, features = ["localfs"] }
hyper = { version = "1", features = ["http1", "server"] }
tempfile = "3"
